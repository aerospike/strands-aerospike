name: Release

# Builds, GPG-signs, and deploys the sdist and wheel to JFrog via aerospike/shared-workflows,
# then creates a release bundle and promotes it to DEV and TEST.
# Pull requests run the same pipeline in dry-run mode (nothing is uploaded or promoted).
# A v* tag performs the real deploy; the tag must match the version in pyproject.toml.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
  workflow_dispatch:
    inputs:
      version:
        description: Version override (leave empty to use the tag)
        required: false
        default: ""
      dry-run:
        description: Build and sign without deploying to JFrog
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  packages: write
  attestations: write

jobs:
  extract-version:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract
        uses: aerospike/shared-workflows/.github/actions/extract-version-from-tag@f7d1ce30b376733a51ea05b99f20646d0e248afc # unreleased main after v5.0.0
        with:
          version: ${{ inputs.version }}

      - name: Verify tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          actual="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$VERSION" != "$actual" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version ${VERSION}, but pyproject.toml has ${actual}."
            exit 1
          fi
    outputs:
      version: ${{ steps.extract.outputs.version }}
      dry-run: ${{ github.event_name == 'pull_request' || inputs.dry-run == true }}

  artifacts-cicd:
    needs: extract-version
    uses: aerospike/shared-workflows/.github/workflows/reusable_artifacts-cicd.yaml@f7d1ce30b376733a51ea05b99f20646d0e248afc # unreleased main after v5.0.0
    with:
      gh-workflows-ref: f7d1ce30b376733a51ea05b99f20646d0e248afc # must match the @ref above
      jf-project: connect
      jf-build-name: strands-aerospike
      version: ${{ needs.extract-version.outputs.version }}
      gh-artifact-directory: output
      build-script: python -m build && mkdir -p output && mv dist/*.whl dist/*.tar.gz output/
      matrix-json: >-
        {"include":[
          {"runs-on":"ubuntu-22.04","distro":"python","arch":"x86_64",
           "setup-python":true,"python-version":"3.12"}
        ]}
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      dry-run: ${{ needs.extract-version.outputs.dry-run == 'true' }}
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  create-release-bundle:
    needs: [extract-version, artifacts-cicd]
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@f7d1ce30b376733a51ea05b99f20646d0e248afc # unreleased main after v5.0.0
    with:
      gh-workflows-ref: f7d1ce30b376733a51ea05b99f20646d0e248afc # must match the @ref above
      jf-project: connect
      jf-build-names: ${{ needs.artifacts-cicd.outputs.jf-build-name }}:${{ needs.artifacts-cicd.outputs.jf-build-id }}
      jf-bundle-name: strands-aerospike
      version: ${{ needs.extract-version.outputs.version }}
      jf-bundle-revision: auto
      dry-run: ${{ needs.extract-version.outputs.dry-run == 'true' }}

  promote-dev:
    needs: [extract-version, create-release-bundle]
    if: needs.extract-version.outputs.dry-run == 'false'
    uses: aerospike/shared-workflows/.github/workflows/reusable_promote-release-bundle.yaml@f7d1ce30b376733a51ea05b99f20646d0e248afc # unreleased main after v5.0.0
    with:
      gh-workflows-ref: f7d1ce30b376733a51ea05b99f20646d0e248afc # must match the @ref above
      jf-project: connect
      jf-bundle-name: strands-aerospike
      version: ${{ needs.create-release-bundle.outputs.bundle-version }}
      target-stage: DEV

  promote-test:
    needs: [create-release-bundle, promote-dev]
    uses: aerospike/shared-workflows/.github/workflows/reusable_promote-release-bundle.yaml@f7d1ce30b376733a51ea05b99f20646d0e248afc # unreleased main after v5.0.0
    with:
      gh-workflows-ref: f7d1ce30b376733a51ea05b99f20646d0e248afc # must match the @ref above
      jf-project: connect
      jf-bundle-name: strands-aerospike
      version: ${{ needs.create-release-bundle.outputs.bundle-version }}
      target-stage: TEST
